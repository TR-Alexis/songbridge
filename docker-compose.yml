version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: songbridge-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: miPassword123
      POSTGRES_DB: songbridge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
